# ===============================
# BASIC CONFIG
# ===============================
server.port=8081
spring.application.name=auth-service

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnect_auth
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# REDIS
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.amqp.deserialization.trust.all=true

# ===============================
# JWT (COMMON KEY)
# ===============================
jwt.secret=hireconnect-jwt-secret-key-2026-secure-global
jwt.expiration=3600000

# ===============================
# EUREKA (FIXED)
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 🔥 IMPORTANT FIX (NO TIMEOUT ISSUE)
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# GITHUB OAUTH (SAFE)
# ===============================
spring.security.oauth2.client.registration.github.client-id=Ov23li4CpBXzmvAaPUOy
spring.security.oauth2.client.registration.github.client-secret=6a54e6d97dd0c9f1b5bb5ac3fea7ec4e42f35f90
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.hireconnect.auth=DEBUG

# ===============================
# ACTUATOR (MINIMAL)
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# SPRING CLOUD FIX
# ===============================
spring.cloud.compatibility-verifier.enabled=false