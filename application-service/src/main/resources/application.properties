server.port=8084
spring.application.name=application-service

# ===============================
# DATABASE (KEEP SIMPLE FOR LOCAL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnectdb
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# RABBITMQ (REQUIRED IF USED)
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# JWT (USE SAME KEY EVERYWHERE)
# ===============================
jwt.secret=hireconnect-jwt-secret-key-2026-secure-global

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# ACTUATOR (MINIMAL FOR LOCAL)
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# LOGGING (CLEAN)
# ===============================
logging.level.org.springframework=INFO
logging.level.com.hireconnect.application=DEBUG

# ===============================
# IMPORTANT FIX
# ===============================
spring.cloud.compatibility-verifier.enabled=false