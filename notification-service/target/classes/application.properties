server.port=8086
spring.application.name=notification-service

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnectdb
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT (COMMON KEY)
# ===============================
jwt.secret=hireconnect-jwt-secret-key-2026-secure-global

# ===============================
# MAIL (REQUIRED IF SENDING EMAIL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rishabhshukla01032004@gmail.com
spring.mail.password=lkcw elxt rzcu hroi

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.initial-interval=1000
spring.rabbitmq.listener.simple.max-attempts=3

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# ACTUATOR (MINIMAL)
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# LOGGING (CLEAN)
# ===============================
logging.level.org.springframework=INFO
logging.level.com.hireconnect.notification=DEBUG

# ===============================
# 🔥 IMPORTANT FIX
# ===============================
spring.cloud.compatibility-verifier.enabled=false