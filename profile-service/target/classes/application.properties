server.port=8082
spring.application.name=profile-service

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnect_profile
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# RABBITMQ (REQUIRED - KEEP)
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.amqp.deserialization.trust.all=true

# ===============================
# JWT (MAKE SAME IN ALL SERVICES)
# ===============================
jwt.secret=hireconnect-jwt-secret-key-2026-secure-global

# ===============================
# EUREKA
# ===============================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===============================
# ACTUATOR (MINIMAL)
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# LOGGING (CLEAN)
# ===============================
logging.level.org.springframework=INFO
logging.level.com.hireconnect.profile=DEBUG